{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Welcome{% endblock %} | ProjectHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'frontend/css/style.css' %}">
</head>
<body class="public-body">
    <header class="public-navbar">
        <div class="public-navbar-inner">
            <a href="{% url 'frontend:landing' %}" class="public-brand">
                <span class="brand-mark">PH</span>
                <span class="public-brand-text">
                    <strong>ProjectHub</strong>
                    <small>Project Management</small>
                </span>
            </a>
            <button class="btn btn-outline-secondary d-lg-none" type="button" data-bs-toggle="collapse" data-bs-target="#publicNav" aria-controls="publicNav" aria-expanded="false" aria-label="Open menu">
                Menu
            </button>
            <nav class="collapse d-lg-flex public-nav" id="publicNav">
                <a href="{% url 'frontend:landing' %}#features">Features</a>
                <a href="{% url 'frontend:landing' %}#how-it-works">How It Works</a>
                <a href="{% url 'frontend:landing' %}#about">About</a>
                <a href="{% url 'frontend:login' %}" class="public-nav-login">Login</a>
                <a href="{% url 'frontend:login' %}" class="btn btn-primary public-nav-cta">Get Started</a>
            </nav>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="public-footer">
        <div class="public-footer-inner">
            <span>ProjectHub academic demo</span>
            <small>Frontend preview · mock data only</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'frontend/js/app.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
