{% extends "frontend/public_base.html" %}

{% block title %}Sign up{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-card card">
        <div class="card-body">
            <h1 class="auth-title">Create a ProjectHub account</h1>
            <p class="hint-text">Demo signup only. Submitting this form opens the dashboard without saving an account.</p>
            <form method="post" action="{% url 'frontend:signup' %}">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label" for="signupName">Full name</label>
                    <input class="form-control" id="signupName" name="full_name" type="text" placeholder="Demo User" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="signupEmail">Email</label>
                    <input class="form-control" id="signupEmail" name="email" type="email" placeholder="demo.user@college.edu" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="signupPassword">Password</label>
                    <input class="form-control" id="signupPassword" name="password" type="password" placeholder="Create a password" required>
                </div>
                <button class="btn btn-primary w-100" type="submit">Sign up</button>
            </form>
            <p class="auth-switch">Already have an account? <a href="{% url 'frontend:login' %}">Login</a></p>
        </div>
    </div>
</section>
{% endblock %}
